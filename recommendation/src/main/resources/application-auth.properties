app.auth.naver.enabled=${NAVER_LOGIN_ENABLED:false}
app.auth.naver.client-id=${NAVER_CLIENT_ID:}
app.auth.naver.client-secret=${NAVER_CLIENT_SECRET:}
app.auth.naver.redirect-uri=${NAVER_REDIRECT_URI:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie
